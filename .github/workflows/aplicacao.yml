name: Aplicação

# Roda quando o front-end existir no repositório. Enquanto não houver
# package.json, o job encerra sem erro em vez de quebrar o quadro de status.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A aplicação já existe?
        id: existe
        run: |
          if [ -f package.json ]; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
            echo "package.json ainda não existe — nada a verificar nesta etapa."
          fi

      - uses: actions/setup-node@v4
        if: steps.existe.outputs.sim == 'true'
        with:
          node-version: '20'
          cache: npm

      - if: steps.existe.outputs.sim == 'true'
        run: npm ci

      - if: steps.existe.outputs.sim == 'true'
        run: npm run lint --if-present


      - if: steps.existe.outputs.sim == 'true'
        run: npm run test:dominio --if-present

      - if: steps.existe.outputs.sim == 'true'
        env:
          # Valor de fachada: o build não conecta no banco, só precisa que a
          # variável exista para não quebrar na coleta de rotas.
          DATABASE_URL: postgresql://app_web:build@localhost:5432/build
        run: npm run build --if-present

  banco-fora-do-cliente:
    name: Acesso ao banco fora do código de cliente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar conexão de banco em arquivo "use client"
        run: |
          falhou=0
          while IFS= read -r arquivo; do
            if head -5 "$arquivo" | grep -q "use client"; then
              if grep -qE "DATABASE_URL|infraestrutura/banco/|infraestrutura/seguranca/senha" "$arquivo"; then
                echo "::error file=$arquivo::acesso ao banco referenciado em componente de cliente"
                falhou=1
              fi
            fi
          done < <(find ./src -name '*.js' -o -name '*.jsx')
          if [ "$falhou" = "1" ]; then exit 1; fi
          echo "nenhuma referência ao banco em código de navegador"
