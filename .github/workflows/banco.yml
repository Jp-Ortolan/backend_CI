name: Banco de dados

# Aplica as migrations num Postgres limpo e roda os testes de regra de negócio.
# Qualquer PR que quebre uma constraint, uma política de acesso ou o cálculo de
# um indicador falha aqui, antes da revisão.

on:
  push:
    branches: [main, develop]
    paths: ['banco/**', 'testes/**', 'scripts/**', 'src/**', '.github/workflows/banco.yml']
  pull_request:
    paths: ['banco/**', 'testes/**', 'scripts/**', 'src/**', '.github/workflows/banco.yml']

jobs:
  migrations-e-testes:
    name: Migrations + testes de regra de negócio
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      # O runner em Node dispensa o psql e já deixa o app_web com senha.
      - name: Migrations, seed e os testes SQL
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/postgres
          BANCO: ecossistema_ci
          SENHA_APP_WEB: app_web
        run: npm run db:testar

      # DATABASE_URL precisa ser a do app_web, que NÃO é dono das tabelas: como
      # dono, o RLS é ignorado e os testes de permissão passam sem testar nada.
      - name: Testes de integração
        env:
          DATABASE_URL: postgresql://app_web:app_web@localhost:5432/ecossistema_ci
          DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/ecossistema_ci
        shell: bash
        run: |
          set -o pipefail
          npm run test:integracao 2>&1 | tee saida-integracao.txt

      # Faltando uma das duas URLs, cada arquivo se pula sozinho e o CI fica
      # verde sem ter rodado nada. Já aconteceu: falhar é melhor que passar.
      - name: Os testes de integração rodaram mesmo?
        run: |
          pularam=$(grep -oP '^# skipped \K[0-9]+' saida-integracao.txt | head -1)
          passaram=$(grep -oP '^# pass \K[0-9]+' saida-integracao.txt | head -1)
          echo "passaram=$passaram pularam=$pularam"
          if [ "${pularam:-0}" -gt 0 ]; then
            echo "::error::$pularam teste(s) de integração pulados — confira DATABASE_URL e DATABASE_URL_ADMIN"
            exit 1
          fi
          if [ "${passaram:-0}" -lt 90 ]; then
            echo "::error::só $passaram testes de integração rodaram; o esperado é 96"
            exit 1
          fi

  migracoes-idempotentes:
    name: Migrations rodam duas vezes sem quebrar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: ecossistema }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Aplicar e reaplicar
        env:
          DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/ecossistema
        run: |
          ./scripts/migrar.sh
          echo "--- segunda passada: nada deve ser aplicado ---"
          saida=$(./scripts/migrar.sh)
          echo "$saida"
          if ! echo "$saida" | grep -q "0 migration(s) aplicada"; then
            echo "::error::a segunda execução aplicou migrations de novo"
            exit 1
          fi

  nomes-das-migrations:
    name: Migrations em ordem e sem duplicata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir nomes e ordem
        run: |
          cd banco/migrations
          for f in *.sql; do
            if ! echo "$f" | grep -qE '^[0-9]{3}_[a-z0-9_]+\.sql$'; then
              echo "::error::nome fora do padrão: $f (use 011_descricao.sql)"
              exit 1
            fi
          done
          if ls *.sql | cut -c1-3 | sort | uniq -d | grep -q .; then
            echo "::error::há migrations com o mesmo número"
            ls *.sql | cut -c1-3 | sort | uniq -d
            exit 1
          fi
          echo "migrations OK: $(ls *.sql | wc -l) arquivo(s)"
